<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: transparent;
      pointer-events: none;
    }

    .aurora-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="aurora-container" id="aurora-ctn"></div>

  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';

    const VERT = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

    const FRAG = `#version 300 es
precision highp float;

uniform float uTime;
uniform float uAmplitude;
uniform vec3 uColorStops[3];
uniform vec2 uResolution;
uniform float uBlend;

out vec4 fragColor;

vec3 permute(vec3 x) {
  return mod(((x * 34.0) + 1.0) * x, 289.0);
}

float snoise(vec2 v){
  const vec4 C = vec4(
      0.211324865405187, 0.366025403784439,
      -0.577350269189626, 0.024390243902439
  );
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);

  vec3 p = permute(
      permute(i.y + vec3(0.0, i1.y, 1.0))
    + i.x + vec3(0.0, i1.x, 1.0)
  );

  vec3 m = max(
      0.5 - vec3(
          dot(x0, x0),
          dot(x12.xy, x12.xy),
          dot(x12.zw, x12.zw)
      ), 
      0.0
  );
  m = m * m;
  m = m * m;

  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);

  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

struct ColorStop {
  vec3 color;
  float position;
};

#define COLOR_RAMP(colors, factor, finalColor) {              \
  int index = 0;                                            \
  for (int i = 0; i < 2; i++) {                               \
     ColorStop currentColor = colors[i];                    \
     bool isInBetween = currentColor.position <= factor;    \
     index = int(mix(float(index), float(i), float(isInBetween))); \
  }                                                         \
  ColorStop currentColor = colors[index];                   \
  ColorStop nextColor = colors[index + 1];                  \
  float range = nextColor.position - currentColor.position; \
  float lerpFactor = (factor - currentColor.position) / range; \
  finalColor = mix(currentColor.color, nextColor.color, lerpFactor); \
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;
  
  ColorStop colors[3];
  colors[0] = ColorStop(uColorStops[0], 0.0);
  colors[1] = ColorStop(uColorStops[1], 0.5);
  colors[2] = ColorStop(uColorStops[2], 1.0);
  
  vec3 rampColor;
  COLOR_RAMP(colors, uv.x, rampColor);
  
  // Gentle, calm wave with reduced amplitude and slow, elegant flow
  float height = snoise(vec2(uv.x * 1.5 + uTime * 0.06, uTime * 0.12)) * 0.35 * uAmplitude;
  height = exp(height);
  height = (uv.y * 1.6 - height + 0.1);
  float intensity = 0.5 * max(0.0, height);
  
  // Smooth atmospheric falloff to seamlessly merge with the dark background
  float bottomFade = smoothstep(0.02, 0.45, uv.y);
  float topFade = smoothstep(1.0, 0.65, uv.y);
  float verticalFade = bottomFade * topFade;
  
  float midPoint = 0.15;
  float auroraAlpha = smoothstep(midPoint - uBlend * 0.45, midPoint + uBlend * 0.45, intensity) * verticalFade * 0.65;
  
  vec3 auroraColor = intensity * rampColor;
  
  fragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
}
`;

    // Configuration object with real Aurora Borealis colors
    let config = {
      colorStops: ['#00FF87', '#60EFFF', '#7C3AED'],
      amplitude: 0.25,
      blend: 0.75,
      speed: 0.25
    };

    const ctn = document.getElementById('aurora-ctn');
    const renderer = new Renderer({
      alpha: true,
      premultipliedAlpha: true,
      antialias: true
    });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.canvas.style.backgroundColor = 'transparent';

    let program;

    function resize() {
      if (!ctn) return;
      const width = window.innerWidth || ctn.offsetWidth || 800;
      const height = window.innerHeight || ctn.offsetHeight || 600;
      renderer.setSize(width, height);
      if (program) {
        program.uniforms.uResolution.value = [width, height];
      }
    }
    window.addEventListener('resize', resize);

    const geometry = new Triangle(gl);
    if (geometry.attributes.uv) {
      delete geometry.attributes.uv;
    }

    function formatColorStops(stops) {
      return (stops && stops.length === 3 ? stops : ['#00FF87', '#60EFFF', '#7C3AED']).map(hex => {
        const c = new Color(hex);
        return [c.r, c.g, c.b];
      });
    }

    program = new Program(gl, {
      vertex: VERT,
      fragment: FRAG,
      uniforms: {
        uTime: { value: 0 },
        uAmplitude: { value: config.amplitude },
        uColorStops: { value: formatColorStops(config.colorStops) },
        uResolution: { value: [window.innerWidth || 800, window.innerHeight || 600] },
        uBlend: { value: config.blend }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });
    ctn.appendChild(gl.canvas);

    // Apply fixed fullscreen background placement behind Streamlit UI
    function setupBackgroundPlacement() {
      try {
        if (window.parent && window.parent.document) {
          const iframes = window.parent.document.querySelectorAll('iframe');
          for (const ifr of iframes) {
            if (ifr.contentWindow === window) {
              ifr.style.position = 'fixed';
              ifr.style.top = '0';
              ifr.style.left = '0';
              ifr.style.width = '100vw';
              ifr.style.height = '100vh';
              ifr.style.zIndex = '0';
              ifr.style.border = 'none';
              ifr.style.pointerEvents = 'none';
              ifr.style.background = 'transparent';

              const parentDiv = ifr.parentElement;
              if (parentDiv) {
                parentDiv.style.position = 'absolute';
                parentDiv.style.top = '0';
                parentDiv.style.left = '0';
                parentDiv.style.width = '0';
                parentDiv.style.height = '0';
                parentDiv.style.overflow = 'visible';
                parentDiv.style.pointerEvents = 'none';
              }
            }
          }
        }
      } catch (e) { }
    }

    setupBackgroundPlacement();
    resize();

    let animateId = 0;
    const update = t => {
      animateId = requestAnimationFrame(update);
      const time = t * 0.01;
      program.uniforms.uTime.value = time * config.speed * 0.1;
      program.uniforms.uAmplitude.value = config.amplitude;
      program.uniforms.uBlend.value = config.blend;
      program.uniforms.uColorStops.value = formatColorStops(config.colorStops);
      renderer.render({ scene: mesh });
    };
    animateId = requestAnimationFrame(update);

    // Handle Streamlit incoming parameters
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        for (const key in args) {
          if (args.hasOwnProperty(key) && args[key] !== undefined) {
            config[key] = args[key];
          }
        }

        if (program) {
          if (args.amplitude !== undefined) program.uniforms.uAmplitude.value = config.amplitude;
          if (args.blend !== undefined) program.uniforms.uBlend.value = config.blend;
          if (args.colorStops !== undefined) program.uniforms.uColorStops.value = formatColorStops(config.colorStops);
        }
        setupBackgroundPlacement();
        resize();
      }
    });

    // Notify Streamlit
    try {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
    } catch (e) { }

    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(animateId);
      window.removeEventListener('resize', resize);
      if (ctn && gl.canvas.parentNode === ctn) {
        ctn.removeChild(gl.canvas);
      }
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    });
  </script>
</body>

</html>
