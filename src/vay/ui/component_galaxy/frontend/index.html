<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Background</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .galaxy-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: transparent;
      pointer-events: none;
    }

    .galaxy-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="galaxy-container" id="galaxy-ctn"></div>

  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';

    const vertexShader = `
attribute vec2 uv;
attribute vec2 position;

varying vec2 vUv;

void main() {
  vUv = uv;
  gl_Position = vec4(position, 0, 1);
}
`;

    const fragmentShader = `
precision highp float;

uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;

varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) {
  return abs(fract(x) * 2.0 - 1.0);
}

float tris(float x) {
  float t = fract(x);
  return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
}

float trisn(float x) {
  float t = fract(x);
  return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);

  vec2 gv = fract(uv) - 0.5; 
  vec2 id = floor(uv);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

      // Pure white star color
      vec3 color = vec3(1.0, 1.0, 1.0);

      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

      float star = Star(gv - offset - pad, flareSize);

      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      
      col += star * size * color;
    }
  }

  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;

  uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

  vec3 col = vec3(0.0);

  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }

  if (uTransparent) {
    float alpha = length(col);
    alpha = smoothstep(0.0, 0.3, alpha);
    alpha = min(alpha, 1.0);
    gl_FragColor = vec4(col, alpha);
  } else {
    gl_FragColor = vec4(col, 1.0);
  }
}
`;

    const config = {
      focal: [0.5, 0.5],
      rotation: [1.0, 0.0],
      starSpeed: 0.5,
      density: 1.5,
      hueShift: 0.0,
      disableAnimation: false,
      speed: 1.0,
      mouseInteraction: false,
      glowIntensity: 0.5,
      saturation: 0.0,
      mouseRepulsion: false,
      repulsionStrength: 0.0,
      twinkleIntensity: 0.35,
      rotationSpeed: 0.08,
      autoCenterRepulsion: 0.0,
      transparent: true
    };

    const ctn = document.getElementById('galaxy-ctn');

    const renderer = new Renderer({
      alpha: config.transparent,
      premultipliedAlpha: false
    });
    const gl = renderer.gl;

    if (config.transparent) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);
    } else {
      gl.clearColor(0, 0, 0, 1);
    }

    let program;

    function getViewportSize() {
      try {
        if (window.parent && window.parent.innerWidth) {
          return { width: window.parent.innerWidth, height: window.parent.innerHeight };
        }
      } catch (e) {}
      return { width: window.innerWidth || ctn.offsetWidth || 800, height: window.innerHeight || ctn.offsetHeight || 600 };
    }

    function resize() {
      const { width, height } = getViewportSize();
      renderer.setSize(width, height);
      if (program) {
        program.uniforms.uResolution.value = new Color(
          gl.canvas.width,
          gl.canvas.height,
          gl.canvas.width / Math.max(1, gl.canvas.height)
        );
      }
    }

    window.addEventListener('resize', resize, false);
    try {
      if (window.parent) {
        window.parent.addEventListener('resize', resize, false);
      }
    } catch (e) {}

    const geometry = new Triangle(gl);
    program = new Program(gl, {
      vertex: vertexShader,
      fragment: fragmentShader,
      uniforms: {
        uTime: { value: 0 },
        uResolution: {
          value: new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width / Math.max(1, gl.canvas.height))
        },
        uFocal: { value: new Float32Array(config.focal) },
        uRotation: { value: new Float32Array(config.rotation) },
        uStarSpeed: { value: config.starSpeed },
        uDensity: { value: config.density },
        uHueShift: { value: config.hueShift },
        uSpeed: { value: config.speed },
        uMouse: {
          value: new Float32Array([0.5, 0.5])
        },
        uGlowIntensity: { value: config.glowIntensity },
        uSaturation: { value: config.saturation },
        uMouseRepulsion: { value: config.mouseRepulsion },
        uTwinkleIntensity: { value: config.twinkleIntensity },
        uRotationSpeed: { value: config.rotationSpeed },
        uRepulsionStrength: { value: config.repulsionStrength },
        uMouseActiveFactor: { value: 0.0 },
        uAutoCenterRepulsion: { value: config.autoCenterRepulsion },
        uTransparent: { value: config.transparent }
      }
    });

    resize();

    let animateId;
    function update(t) {
      animateId = requestAnimationFrame(update);
      if (!config.disableAnimation) {
        program.uniforms.uTime.value = t * 0.001;
        program.uniforms.uStarSpeed.value = (t * 0.001 * config.starSpeed) / 10.0;
      }

      renderer.render({ scene: mesh });
    }

    const mesh = new Mesh(gl, { geometry, program });
    animateId = requestAnimationFrame(update);

    // Apply fixed fullscreen background styling to iframe container if in Streamlit parent
    function setupBackgroundPlacement() {
      try {
        if (window.parent && window.parent.document) {
          const iframes = window.parent.document.querySelectorAll('iframe');
          for (const ifr of iframes) {
            if (ifr.contentWindow === window) {
              ifr.style.position = 'fixed';
              ifr.style.top = '0';
              ifr.style.left = '0';
              ifr.style.width = '100vw';
              ifr.style.height = '100vh';
              ifr.style.zIndex = '0';
              ifr.style.border = 'none';
              ifr.style.pointerEvents = 'none';
              ifr.style.background = 'transparent';

              const parentDiv = ifr.parentElement;
              if (parentDiv) {
                parentDiv.style.position = 'absolute';
                parentDiv.style.top = '0';
                parentDiv.style.left = '0';
                parentDiv.style.width = '0';
                parentDiv.style.height = '0';
                parentDiv.style.overflow = 'visible';
                parentDiv.style.pointerEvents = 'none';
              }
            }
          }
        }
      } catch (e) {
        console.log("Cross-frame parent styling check completed:", e);
      }
    }

    ctn.appendChild(gl.canvas);
    setupBackgroundPlacement();

    // Handle Streamlit incoming parameters
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        for (const key in args) {
          if (args.hasOwnProperty(key) && args[key] !== undefined) {
            config[key] = args[key];
          }
        }

        if (program) {
          if (args.focal) program.uniforms.uFocal.value = new Float32Array(config.focal);
          if (args.rotation) program.uniforms.uRotation.value = new Float32Array(config.rotation);
          if (args.starSpeed !== undefined) program.uniforms.uStarSpeed.value = config.starSpeed;
          if (args.density !== undefined) program.uniforms.uDensity.value = config.density;
          if (args.hueShift !== undefined) program.uniforms.uHueShift.value = config.hueShift;
          if (args.speed !== undefined) program.uniforms.uSpeed.value = config.speed;
          if (args.glowIntensity !== undefined) program.uniforms.uGlowIntensity.value = config.glowIntensity;
          if (args.saturation !== undefined) program.uniforms.uSaturation.value = config.saturation;
          if (args.twinkleIntensity !== undefined) program.uniforms.uTwinkleIntensity.value = config.twinkleIntensity;
          if (args.rotationSpeed !== undefined) program.uniforms.uRotationSpeed.value = config.rotationSpeed;
          if (args.transparent !== undefined) program.uniforms.uTransparent.value = config.transparent;
        }
        setupBackgroundPlacement();
        resize();
      }
    });

    // Notify Streamlit
    try {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
    } catch (e) {}

    // Clean up on unload
    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(animateId);
      window.removeEventListener('resize', resize);
      try {
        if (window.parent) {
          window.parent.removeEventListener('resize', resize);
        }
      } catch (e) {}
    });
  </script>
</body>

</html>
