<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specular Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Electrolize', sans-serif !important;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: visible;
      background: transparent;
      font-family: 'Electrolize', sans-serif !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      width: 100%;
    }

    .btn-wrapper.full-width {
      width: 100%;
    }

    .btn-wrapper.full-width .specular-button {
      width: 100%;
    }

    .specular-button {
      --sb-radius: 18px;
      --sb-tint: #ffffff;
      --sb-tint-opacity: 0;
      --sb-blur: 0px;
      --sb-text-color: #f5f5f5;

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--sb-text-color);
      background: color-mix(in srgb, var(--sb-tint) calc(var(--sb-tint-opacity) * 100%), transparent);
      border-radius: var(--sb-radius);
      backdrop-filter: blur(var(--sb-blur));
      -webkit-backdrop-filter: blur(var(--sb-blur));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .specular-button:hover {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .specular-button:active {
      transform: scale(0.97);
    }

    .specular-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--sb-text-color) 60%, transparent);
      outline-offset: 3px;
    }

    .specular-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .specular-button:disabled:active {
      transform: none;
    }

    .specular-button--sm {
      font-size: 0.85rem;
      padding: 10px 22px;
    }

    .specular-button--md {
      font-size: 1rem;
      padding: 14px 30px;
    }

    .specular-button--lg {
      font-size: 1.12rem;
      padding: 16px 36px;
    }

    /* Canvas extends past the button so the rim glow can bleed outside the edge */
    .specular-button__fx {
      position: absolute;
      inset: -20px;
      pointer-events: none;
      z-index: 1;
    }

    .specular-button__fx canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .specular-button__label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(96, 239, 255, 0.45), 0 2px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>
  <div class="btn-wrapper full-width" id="btn-wrapper">
    <button id="specular-btn" type="button" class="specular-button specular-button--lg">
      <span id="fx-root" class="specular-button__fx" aria-hidden="true"></span>
      <span id="label-root" class="specular-button__label">Get Started</span>
    </button>
  </div>

  <script type="module">
    import { Renderer, Program, Mesh, Triangle, Color } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';

    const PAD = 20;

    const VERT = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

    const FRAG = `#version 300 es
precision highp float;

uniform vec2 uCenter;
uniform vec2 uHalfSize;
uniform float uRadius;
uniform float uAngle;
uniform float uPx;
uniform vec3 uLineColor;
uniform vec3 uBaseColor;
uniform float uIntensity;
uniform float uShineSize;
uniform float uShineFade;
uniform float uThickness;
uniform float uBaseWidth;

out vec4 fragColor;

float sdRoundedRect(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float shapeSDF(vec2 p) { return sdRoundedRect(p, uHalfSize, uRadius); }

float gaussianLine(float d, float sigma) {
  float x = d / (sigma + 1e-6);
  float k = mix(1.0, 1.6, smoothstep(0.0, 1.5, x));
  return exp(-k * x * x);
}

void main() {
  vec2 p = gl_FragCoord.xy - uCenter;
  float d = shapeSDF(p);
  vec2 L = vec2(cos(uAngle), sin(uAngle));

  // Dark base stroke hugging the edge for a sense of thickness
  float base = (1.0 - smoothstep(0.0, uBaseWidth, abs(d))) * 0.45;

  // Symmetric specular: the edges facing toward/away from the light both
  // catch a streak. The angular window (size + fade) is measured with an
  // elliptical normal so it varies continuously along straight edges.
  vec2 nEll = normalize(p / (uHalfSize * uHalfSize) + 1e-6);
  float phi = acos(clamp(abs(dot(nEll, L)), 0.0, 1.0));
  float rim = 1.0 - smoothstep(uShineSize - uShineFade, uShineSize + uShineFade + 1e-4, phi);
  float line = gaussianLine(d, uThickness);
  float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));
  float hi = line * rim * edgeClamp * uIntensity;

  vec3 col = uBaseColor * base + uLineColor * hi;
  float a = clamp(base + hi, 0.0, 1.0);
  fragColor = vec4(col, a);
}
`;

    const btn = document.getElementById('specular-btn');
    const fx = document.getElementById('fx-root');
    const labelRoot = document.getElementById('label-root');
    const wrapper = document.getElementById('btn-wrapper');

    const config = {
      label: 'Get Started',
      size: 'lg',
      radius: 18,
      tint: '#ffffff',
      tintOpacity: 0,
      blur: 0,
      textColor: '#f5f5f5',
      lineColor: '#ffffff',
      baseColor: '#525252',
      intensity: 1.0,
      shineSize: 10,
      shineFade: 40,
      thickness: 1,
      speed: 0.35,
      followMouse: true,
      proximity: 250,
      autoAnimate: false,
      disabled: false,
      fullWidth: true
    };

    const dpr = window.devicePixelRatio || 1;
    const renderer = new Renderer({ alpha: true, premultipliedAlpha: true, antialias: true, dpr });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    const geometry = new Triangle(gl);
    if (geometry.attributes.uv) delete geometry.attributes.uv;

    const program = new Program(gl, {
      vertex: VERT,
      fragment: FRAG,
      uniforms: {
        uCenter: { value: [0, 0] },
        uHalfSize: { value: [1, 1] },
        uRadius: { value: 0 },
        uAngle: { value: 2.4 },
        uPx: { value: dpr },
        uLineColor: { value: [1, 1, 1] },
        uBaseColor: { value: [0.32, 0.32, 0.32] },
        uIntensity: { value: 1 },
        uShineSize: { value: 0.17 },
        uShineFade: { value: 0.7 },
        uThickness: { value: 1 },
        uBaseWidth: { value: dpr }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });
    fx.appendChild(gl.canvas);

    const sizeRef = { w: 1, h: 1 };
    const resize = () => {
      const rect = btn.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if (w <= 0 || h <= 0) return;
      sizeRef.w = w;
      sizeRef.h = h;
      renderer.setSize(w + PAD * 2, h + PAD * 2);
      program.uniforms.uCenter.value = [(PAD + w / 2) * dpr, (PAD + h / 2) * dpr];
      program.uniforms.uHalfSize.value = [(w / 2) * dpr, (h / 2) * dpr];
      sendFrameHeight();
    };
    const ro = new ResizeObserver(resize);
    ro.observe(btn);

    let pointerAngle = null;
    let proximityT = 0;

    const updatePointer = (clientX, clientY) => {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = Math.max(rect.left - clientX, 0, clientX - rect.right);
      const dy = Math.max(rect.top - clientY, 0, clientY - rect.bottom);
      const dist = Math.hypot(dx, dy);

      if (dist === 0) {
        const nx = (clientX - cx) / (rect.width / 2);
        const ny = (cy - clientY) / (rect.height / 2);
        pointerAngle = Math.atan2(2 / rect.height, -2 / rect.width) + nx * 0.3 + ny * 0.15;
      } else {
        pointerAngle = Math.atan2(cy - clientY, clientX - cx);
      }
      const t = Math.max(0, 1 - dist / Math.max(config.proximity, 1));
      proximityT = t * t * (3 - 2 * t);
    };

    const onPointerMove = e => {
      updatePointer(e.clientX, e.clientY);
    };
    window.addEventListener('pointermove', onPointerMove);

    // Also listen to parent pointer events if available
    try {
      if (window.parent && window.parent !== window) {
        window.parent.addEventListener('pointermove', e => {
          const iframeRect = window.frameElement ? window.frameElement.getBoundingClientRect() : { left: 0, top: 0 };
          const localX = e.clientX - iframeRect.left;
          const localY = e.clientY - iframeRect.top;
          updatePointer(localX, localY);
        });
      }
    } catch (err) {
      // Cross-origin iframe fallback
    }

    let angle = 2.4;
    let idleAngle = 2.4;
    let bright = 0;
    let last = performance.now();
    let raf = 0;

    const lineC = new Color();
    const baseC = new Color();

    const update = now => {
      raf = requestAnimationFrame(update);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      idleAngle += config.speed * dt;
      const steer = config.followMouse && pointerAngle != null && (!config.autoAnimate || proximityT > 0);
      const target = steer ? pointerAngle : idleAngle;
      const diff = ((target - angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      angle += diff * (1 - Math.exp(-dt * 7));

      const brightTarget = config.autoAnimate ? 1 : proximityT;
      bright += (brightTarget - bright) * (1 - Math.exp(-dt * 8));

      lineC.set(config.lineColor);
      baseC.set(config.baseColor);
      program.uniforms.uAngle.value = angle;
      program.uniforms.uRadius.value = Math.min(config.radius, Math.min(sizeRef.w, sizeRef.h) / 2) * dpr;
      program.uniforms.uLineColor.value = [lineC.r, lineC.g, lineC.b];
      program.uniforms.uBaseColor.value = [baseC.r, baseC.g, baseC.b];
      program.uniforms.uIntensity.value = config.intensity * bright;
      program.uniforms.uShineSize.value = (config.shineSize * Math.PI) / 180;
      program.uniforms.uShineFade.value = (config.shineFade * Math.PI) / 180;
      program.uniforms.uThickness.value = config.thickness * dpr;
      renderer.render({ scene: mesh });
    };
    raf = requestAnimationFrame(update);

    function applyConfig() {
      labelRoot.innerHTML = config.label || 'Get Started';
      btn.className = `specular-button specular-button--${config.size || 'lg'}`;
      btn.disabled = !!config.disabled;
      
      btn.style.setProperty('--sb-radius', `${config.radius}px`);
      btn.style.setProperty('--sb-tint', config.tint);
      btn.style.setProperty('--sb-tint-opacity', config.tintOpacity);
      btn.style.setProperty('--sb-blur', `${config.blur}px`);
      btn.style.setProperty('--sb-text-color', config.textColor);

      if (config.fullWidth) {
        wrapper.classList.add('full-width');
      } else {
        wrapper.classList.remove('full-width');
      }

      resize();
    }

    function sendFrameHeight() {
      const height = document.body.scrollHeight || 75;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: Math.max(height, 75)
      }, "*");
    }

    // Click handler to communicate with Streamlit
    btn.addEventListener('click', () => {
      if (config.disabled) return;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: {
          event: "click",
          id: Date.now() + "_" + Math.random().toString(36).substring(2, 9)
        }
      }, "*");
    });

    // Handle Streamlit incoming parameters
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};
        for (const key in args) {
          if (args.hasOwnProperty(key) && args[key] !== undefined) {
            config[key] = args[key];
          }
        }
        applyConfig();
        sendFrameHeight();
      }
    });

    // Notify Streamlit ready
    try {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      sendFrameHeight();
    } catch (e) { }

    window.addEventListener('resize', sendFrameHeight);
  </script>
</body>

</html>
