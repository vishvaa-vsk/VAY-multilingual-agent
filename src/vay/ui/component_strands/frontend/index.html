<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strands Visualizer & Mic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
  
  <!-- Silero VAD WebAssembly dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/ort.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.18/dist/bundle.min.js"></script>
  
  <style>
    :root {
      --bg-dark: rgba(10, 10, 12, 0.95);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --glow-idle: rgba(255, 255, 255, 0.2);
      --glow-listening: rgba(249, 115, 22, 0.6);
      --glow-thinking: rgba(124, 58, 237, 0.6);
      --glow-speaking: rgba(6, 182, 212, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Electrolize', sans-serif !important;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      font-family: 'Electrolize', sans-serif !important;
      color: var(--text-main);
    }

    .strands-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent !important;
      background-color: transparent !important;
    }

    .strands-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px 24px 24px 24px;
      pointer-events: none;
    }

    .header-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 40px;
    }

    .header-bar h1 {
      font-size: 10px;
      font-weight: 9000;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 0.1px #2d2d2d;
    
      margin-bottom: 2px;
    }

    .header-bar p {
      font-size: 12px;
      color: var(--text-sub);
    }

    .controls-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }


    .mic-button-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: transparent;
      border: 2px solid transparent;
      opacity: 0;
      pointer-events: none;
    }

    /* Listening Pulse Animation */
    .status-listening .pulse-ring {
      border-color: #f97316;
      animation: pulse-out 2s infinite ease-out;
    }

    .status-listening .pulse-ring:nth-child(2) {
      animation-delay: 0.6s;
    }

    .status-listening .pulse-ring:nth-child(3) {
      animation-delay: 1.2s;
    }

    @keyframes pulse-out {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
        filter: blur(1px);
      }

      100% {
        transform: scale(2.2);
        opacity: 0;
        filter: blur(8px);
      }
    }

    .mic-button {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
    }

    .mic-button svg {
      width: 32px;
      height: 32px;
      fill: var(--text-main);
      transition: all 0.3s ease;
    }

    /* Status specific styles */
    .status-idle .mic-button {
      box-shadow: 0 0 20px var(--glow-idle), inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .status-idle .mic-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }

    .status-listening .mic-button {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.05));
      border-color: rgba(249, 115, 22, 0.4);
      box-shadow: 0 0 30px var(--glow-listening), inset 0 0 15px rgba(249, 115, 22, 0.2);
      transform: scale(1.05);
    }

    .status-listening .mic-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px var(--glow-listening), inset 0 0 20px rgba(249, 115, 22, 0.3);
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.35), rgba(249, 115, 22, 0.1));
    }

    .status-listening .mic-button svg {
      fill: #f97316;
      transform: scale(1.1);
    }

    .status-thinking .mic-button {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(124, 58, 237, 0.02));
      border-color: rgba(124, 58, 237, 0.3);
      box-shadow: 0 0 25px var(--glow-thinking);
      transform: scale(0.95);
      animation: thinking-breathing 1.5s infinite alternate ease-in-out;
    }

    .status-thinking .mic-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px var(--glow-thinking);
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(124, 58, 237, 0.1));
      animation-play-state: paused;
    }

    .status-thinking .mic-button svg {
      fill: #7c3aed;
      animation: spinning-icon 2s infinite linear;
    }

    @keyframes thinking-breathing {
      0% {
        box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      }

      100% {
        box-shadow: 0 0 35px rgba(124, 58, 237, 0.8);
      }
    }

    @keyframes spinning-icon {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .status-speaking .mic-button {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(6, 182, 212, 0.05));
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 30px var(--glow-speaking), inset 0 0 15px rgba(6, 182, 212, 0.1);
    }

    .status-speaking .mic-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px var(--glow-speaking), inset 0 0 20px rgba(6, 182, 212, 0.25);
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.35), rgba(6, 182, 212, 0.1));
    }

    .status-speaking .mic-button svg {
      fill: #06b6d4;
    }

    .status-handoff .mic-button {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }

    .status-handoff .mic-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.7);
      background: rgba(239, 68, 68, 0.3);
    }

    .status-handoff .mic-button svg {
      fill: #ef4444;
    }

    .status-label {
      display: none;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    .status-idle .status-label {
      color: var(--text-sub);
    }

    .status-listening .status-label {
      color: #f97316;
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
    }

    .status-thinking .status-label {
      color: #7c3aed;
      text-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
    }

    .status-speaking .status-label {
      color: #06b6d4;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
    }

    .status-handoff .status-label {
      color: #ef4444;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .bottom-controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 450px;
      gap: 16px;
      pointer-events: auto;
      margin-bottom: 10px;
    }

    .control-btn {
      flex: 0 0 120px;
      width: 120px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-main);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .control-btn.btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ffffff;
    }

    .control-btn.btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
    }

    /* SpecularButton Styles */
    .specular-button {
      --sb-radius: 18px;
      --sb-tint: #ffffff;
      --sb-tint-opacity: 0;
      --sb-blur: 0px;
      --sb-text-color: #f5f5f5;

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--sb-text-color);
      background: color-mix(in srgb, var(--sb-tint) calc(var(--sb-tint-opacity) * 100%), transparent);
      border-radius: var(--sb-radius);
      backdrop-filter: blur(var(--sb-blur));
      -webkit-backdrop-filter: blur(var(--sb-blur));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 24px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .specular-button:hover {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 10px 28px rgba(239, 68, 68, 0.3);
    }

    .specular-button:active {
      transform: scale(0.96);
    }

    .specular-button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--sb-text-color) 60%, transparent);
      outline-offset: 3px;
    }

    .specular-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .specular-button:disabled:active {
      transform: none;
    }

    .specular-button--sm {
      font-size: 0.85rem;
      padding: 10px 22px;
    }

    .specular-button--md {
      font-size: 0.95rem;
      padding: 12px 24px;
    }

    .specular-button--lg {
      font-size: 1.12rem;
      padding: 16px 36px;
    }

    .specular-button__fx {
      position: absolute;
      inset: -20px;
      pointer-events: none;
      z-index: 1;
    }

    .specular-button__fx canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .specular-button__label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .end-button-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .end-button {
      position: relative;
      width: 80px !important;
      height: 80px !important;
      border-radius: 50% !important;
      padding: 0 !important;
      border: 1px solid rgba(239, 68, 68, 0.4) !important;
      background: rgba(239, 68, 68, 0.12) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px rgba(239, 68, 68, 0.2) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
    }

    .end-button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.6), inset 0 0 15px rgba(239, 68, 68, 0.3) !important;
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: rgba(239, 68, 68, 0.7) !important;
    }

    .end-button:active {
      transform: scale(0.95);
    }

    .end-button svg {
      width: 28px;
      height: 28px;
      stroke: #ef4444;
      transition: all 0.3s ease;
    }

    .end-button:hover svg {
      stroke: #ffffff;
      transform: rotate(90deg);
    }
  </style>
</head>

<body class="status-idle" id="body-root">

  <div class="strands-container" id="strands-ctn"></div>

  <div class="ui-overlay">
    <div class="header-bar">
      <h1>multilingual voice assistant</h1>
      <p id="sub-status">Speech Interface Active</p>
    </div>


    <div class="controls-center">
      <div class="status-label" id="status-txt">READY</div>
    </div>

    <div class="bottom-controls">
      <div class="mic-button-container" id="pulse-container">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <button class="mic-button" id="mic-btn" title="Toggle Microphone">
          <svg viewBox="0 0 24 24" id="mic-svg">
            <!-- Default Mic Icon -->
            <path
              d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" />
          </svg>
        </button>
      </div>
      <div class="end-button-container">
        <button class="specular-button end-button" id="end-btn" title="End Session"
          style="--sb-radius: 40px; --sb-tint: #ef4444; --sb-tint-opacity: 0.16; --sb-blur: 16px; --sb-text-color: #ef4444;">
          <span id="end-btn-fx" class="specular-button__fx" aria-hidden="true"></span>
          <span class="specular-button__label">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#ef4444" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle, RenderTarget } from 'https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm';

    const MAX_STRANDS = 12;
    const MAX_COLORS = 8;

    const VERT = `#version 300 es
    in vec2 position;
    void main() {
      gl_Position = vec4(position, 0.0, 1.0);
    }
    `;

    const FRAG = `#version 300 es
    precision highp float;

    uniform float uTime;
    uniform vec2 uResolution;
    uniform vec3 uColors[${MAX_COLORS}];
    uniform int uColorCount;
    uniform int uStrandCount;
    uniform float uSpeed;
    uniform float uAmplitude;
    uniform float uWaviness;
    uniform float uThickness;
    uniform float uGlow;
    uniform float uTaper;
    uniform float uSpread;
    uniform float uHueShift;
    uniform float uIntensity;
    uniform float uOpacity;
    uniform float uScale;
    uniform float uSaturation;

    out vec4 fragColor;

    const float PI = 3.14159265;

    vec3 spectrum(float t) {
      return 0.5 + 0.5 * cos(2.0 * PI * (t + vec3(0.00, 0.33, 0.67)));
    }

    vec3 samplePalette(float t) {
      t = fract(t);
      float scaled = t * float(uColorCount);
      int idx = int(floor(scaled));
      float blend = fract(scaled);
      int nextIdx = idx + 1;
      if (nextIdx >= uColorCount) nextIdx = 0;
      return mix(uColors[idx], uColors[nextIdx], blend);
    }

    vec3 strandColor(float t) {
      if (uColorCount > 0) return samplePalette(t);
      return spectrum(t);
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
      uv /= max(uScale, 0.0001);

      float e = 0.06 + uIntensity * 0.94;
      float env = pow(max(cos(uv.x * PI * 1.3), 0.0), uTaper);

      vec3 col = vec3(0.0);

      for (int i = 0; i < ${MAX_STRANDS}; i++) {
        if (i >= uStrandCount) break;

        float fi = float(i);
        float ph = fi * 1.7 * uSpread;
        float freq = (2.0 + fi * 0.35) * uWaviness;
        float spd = 1.4 + fi * 1.2;

        float tt = uTime * uSpeed;
        float w = sin(uv.x * freq + tt * spd + ph) * 0.60
                + sin(uv.x * freq * 1.1 - tt * spd * 0.7 + ph * 1.7) * 0.40;

        float amp = (0.1 + 0.02 * e) * env * uAmplitude;
        float y = w * amp;

        float d = abs(uv.y - y);
        float thick = (0.001 + 0.05 * e) * (0.35 + env) * uThickness;
        float g = thick / (d + thick * 0.45);
        g = g * g;

        float h = fi / float(uStrandCount) + uv.x * 0.30 + uTime * 0.04 + uHueShift;
        col += strandColor(h) * g * env;
      }

      col *= 0.45 + 0.7 * e;
      col = 1.0 - exp(-col * uGlow);

      float gray = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = max(mix(vec3(gray), col, uSaturation), 0.0);

      float lum = max(max(col.r, col.g), col.b);
      float alpha = clamp(lum, 0.0, 1.0) * uOpacity;

      fragColor = vec4(col * uOpacity, alpha);
    }
    `;

    const GLASS_FRAG = `#version 300 es
    precision highp float;

    uniform sampler2D uScene;
    uniform vec2 uResolution;
    uniform float uRadius;
    uniform float uRefraction;
    uniform float uDispersion;

    out vec4 fragColor;

    vec2 toUv(vec2 p) {
      return p * (uResolution.y / uResolution) + 0.5;
    }

    void main() {
      vec2 p = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
      float d = length(p);
      float r = uRadius;

      float edge = fwidth(d) * 1.5;
      float mask = 1.0 - smoothstep(r - edge, r + edge, d);
      if (mask <= 0.0) {
        fragColor = vec4(0.0);
        return;
      }

      float z = sqrt(max(r * r - d * d, 0.0)) / r;
      float nd = d / r;

      vec2 dir = d > 0.0 ? p / d : vec2(0.0);
      float lens = smoothstep(0.85, 1.0, nd) * pow(nd, 6.0);
      vec2 offset = -dir * lens * uRefraction * 0.15;
      vec2 disp = -dir * lens * uDispersion * 0.012;

      vec3 light;
      light.r = texture(uScene, toUv(p + offset - disp)).r;
      light.g = texture(uScene, toUv(p + offset)).g;
      light.b = texture(uScene, toUv(p + offset + disp)).b;

      float fres = pow(1.0 - z, 3.0);
      vec3 rim = vec3(1.0) * fres * 0.18;

      vec2 lightDir = normalize(vec2(-0.55, 0.6));
      float spec = pow(max(dot(p / max(r, 1e-4), lightDir), 0.0), 6.0);
      spec *= smoothstep(r, r * 0.55, d);

      vec3 emissive = light + rim + vec3(spec) * 0.4;
      float emissiveA = clamp(max(max(emissive.r, emissive.g), emissive.b), 0.0, 1.0);

      float bodyA = 0.05 + fres * 0.05;

      float outA = emissiveA + bodyA * (1.0 - emissiveA);
      vec3 outRGB = emissive;

      outRGB *= mask;
      outA *= mask;

      fragColor = vec4(outRGB, outA);
    }
    `;

    const buildPalette = colors => {
      const filled = colors && colors.length ? colors : ['#ffffff'];
      const padded = [];
      for (let i = 0; i < MAX_COLORS; i++) {
        const hex = filled[i] ?? filled[filled.length - 1];
        const c = new Color(hex);
        padded.push([c.r, c.g, c.b]);
      }
      return padded;
    };

    // Component configuration properties with default values
    let config = {
      colors: ['#FF4242', '#7C3AED', '#06B6D4', '#EAB308'],
      count: 4,
      speed: 0.1,
      amplitude: 1.0,
      waviness: 1.1,
      thickness: 0.8,
      glow: 1.2,
      taper: 3.0,
      spread: 1.0,
      hueShift: 0.0,
      intensity: 0.6,
      saturation: 1.5,
      opacity: 1.0,
      scale: 1.5,
      glass: false,
      refraction: 1.0,
      dispersion: 1.0,
      glassSize: 1.0,
      status: 'idle',
      audio_data: null
    };

    // State Variables for visualizer reactivity
    let micVolume = 0.0;
    let targetSpeedMod = 0.0;
    let currentSpeedMod = 0.0;
    let targetAmpMod = 0.0;
    let currentAmpMod = 0.0;

    // Web Audio Variables for recording & playback visualizer
    let audioContext = null;
    let analyserNode = null;
    let micStream = null;
    let micProcessor = null;
    let recordedChunks = [];
    let isRecording = false;
    let activeAudioSource = null;
    let recordingLength = 0;

    // DOM References
    const bodyRoot = document.getElementById('body-root');
    const statusTxt = document.getElementById('status-txt');
    const subStatusTxt = document.getElementById('sub-status');
    const micBtn = document.getElementById('mic-btn');
    const endBtn = document.getElementById('end-btn');
    // UI helper for icon updates
    function setMicIcon(iconType) {
      const micSvg = document.getElementById('mic-svg');
      if (iconType === 'stop') {
        // Red square / Stop icon
        micSvg.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2" />';
      } else if (iconType === 'thinking') {
        // Spinning reload icon
        micSvg.innerHTML = '<path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm-6.7 2.2L3.84 4.74C2.46 6.97 2 9.57 2 12c0 4.42 3.58 8 8 8v-3c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8z"/>';
      } else {
        // Microphone icon
        micSvg.innerHTML = '<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>';
      }
    }

    // Set UI state classes & label text
    function updateUIState(state) {
      bodyRoot.className = `status-${state}`;
      statusTxt.textContent = state.toUpperCase();

      if (state === 'idle') {
        setMicIcon('mic');
        subStatusTxt.textContent = 'Click mic to start';
      } else if (state === 'listening') {
        setMicIcon('stop');
        subStatusTxt.textContent = 'Listening...';
      } else if (state === 'thinking') {
        setMicIcon('thinking');
        subStatusTxt.textContent = '.......';
      } else if (state === 'speaking') {
        setMicIcon('mic');
        subStatusTxt.textContent = 'Answering....';
      } else if (state === 'handoff' || state === 'ended') {
        setMicIcon('mic');
        subStatusTxt.textContent = 'Call Ended';
      }

      // Update iframe height automatically
      sendFrameHeight();
    }

    // Send messages back to Streamlit with unique event ID to avoid re-triggering on rerun
    function sendMessageToStreamlit(data) {
      if (!data) data = {};
      if (!data.id) {
        data.id = Date.now() + "_" + Math.random().toString(36).substring(2, 9);
      }
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function sendFrameHeight() {
      // We want to make sure the full height is represented in Streamlit
      const height = document.body.scrollHeight || 600;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
      }, "*");
    }

    // WebGL Strands Setup
    const ctn = document.getElementById('strands-ctn');
    const renderer = new Renderer({
      alpha: true,
      premultipliedAlpha: true,
      antialias: true
    });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.canvas.style.backgroundColor = 'transparent';
    gl.canvas.style.background = 'transparent';

    function ensureTransparency() {
      try {
        if (window.parent && window.parent.document) {
          const iframes = window.parent.document.querySelectorAll('iframe');
          for (const ifr of iframes) {
            if (ifr.contentWindow === window) {
              ifr.style.background = 'transparent';
              ifr.style.backgroundColor = 'transparent';
              ifr.setAttribute('allowtransparency', 'true');
              if (ifr.parentElement) {
                ifr.parentElement.style.background = 'transparent';
                ifr.parentElement.style.backgroundColor = 'transparent';
              }
            }
          }
        }
      } catch (e) { }
    }
    ensureTransparency();

    const geometry = new Triangle(gl);
    if (geometry.attributes.uv) {
      delete geometry.attributes.uv;
    }

    const program = new Program(gl, {
      vertex: VERT,
      fragment: FRAG,
      uniforms: {
        uTime: { value: 0 },
        uResolution: { value: [ctn.offsetWidth, ctn.offsetHeight] },
        uColors: { value: buildPalette(config.colors) },
        uColorCount: { value: Math.min(config.colors.length, MAX_COLORS) },
        uStrandCount: { value: Math.min(config.count, MAX_STRANDS) },
        uSpeed: { value: config.speed },
        uAmplitude: { value: config.amplitude },
        uWaviness: { value: config.waviness },
        uThickness: { value: config.thickness },
        uGlow: { value: config.glow },
        uTaper: { value: config.taper },
        uSpread: { value: config.spread },
        uHueShift: { value: config.hueShift },
        uIntensity: { value: config.intensity },
        uOpacity: { value: config.opacity },
        uScale: { value: config.scale },
        uSaturation: { value: config.saturation }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });

    const renderTarget = new RenderTarget(gl, {
      width: ctn.offsetWidth,
      height: ctn.offsetHeight
    });

    const glassProgram = new Program(gl, {
      vertex: VERT,
      fragment: GLASS_FRAG,
      uniforms: {
        uScene: { value: renderTarget.texture },
        uResolution: { value: [ctn.offsetWidth, ctn.offsetHeight] },
        uRadius: { value: 0.46 * config.glassSize },
        uRefraction: { value: config.refraction },
        uDispersion: { value: config.dispersion }
      }
    });
    const glassMesh = new Mesh(gl, { geometry, program: glassProgram });

    ctn.appendChild(gl.canvas);

    function resize() {
      if (!ctn) return;
      const width = ctn.offsetWidth;
      const height = ctn.offsetHeight;
      renderer.setSize(width, height);
      program.uniforms.uResolution.value = [width, height];
      renderTarget.setSize(width, height);
      glassProgram.uniforms.uResolution.value = [width, height];
      sendFrameHeight();
    }
    window.addEventListener('resize', resize);
    resize();

    // Animation Loop
    let animateId = 0;
    const update = t => {
      animateId = requestAnimationFrame(update);

      // Interpolate audio reactivity smoothly — low factor = very steady, no jolting
      currentSpeedMod += (targetSpeedMod - currentSpeedMod) * 0.04;
      currentAmpMod += (targetAmpMod - currentAmpMod) * 0.04;

      program.uniforms.uTime.value = t * 0.001;
      program.uniforms.uColors.value = buildPalette(config.colors);
      program.uniforms.uColorCount.value = Math.min(config.colors.length, MAX_COLORS);
      program.uniforms.uStrandCount.value = Math.min(Math.max(Math.round(config.count), 1), MAX_STRANDS);

      // Combine base properties with live audio mod
      program.uniforms.uSpeed.value = config.speed + currentSpeedMod;
      program.uniforms.uAmplitude.value = config.amplitude + currentAmpMod;

      program.uniforms.uWaviness.value = config.waviness;
      program.uniforms.uThickness.value = config.thickness;
      program.uniforms.uGlow.value = config.glow;
      program.uniforms.uTaper.value = config.taper;
      program.uniforms.uSpread.value = config.spread;
      program.uniforms.uHueShift.value = config.hueShift;
      program.uniforms.uIntensity.value = config.intensity;
      program.uniforms.uOpacity.value = config.opacity;
      program.uniforms.uScale.value = config.scale;
      program.uniforms.uSaturation.value = config.saturation;

      if (config.glass) {
        renderer.render({ scene: mesh, target: renderTarget });
        glassProgram.uniforms.uScene.value = renderTarget.texture;
        glassProgram.uniforms.uRefraction.value = config.refraction;
        glassProgram.uniforms.uDispersion.value = config.dispersion;
        glassProgram.uniforms.uRadius.value = 0.46 * config.glassSize;
        renderer.render({ scene: glassMesh });
      } else {
        renderer.render({ scene: mesh });
      }

      // If active listening or speaking, run audio FFT visualizer

      if (analyserNode && (config.status === 'listening' || config.status === 'speaking')) {
        const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
        analyserNode.getByteFrequencyData(dataArray);

        // Apply volume FFT values to styling elements
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const avg = sum / dataArray.length;

        // Update strands reactivity based on audio volume
        targetAmpMod   = Math.min((avg / 255) * 0.3, 0.25);
        targetSpeedMod = Math.min((avg / 255) * 0.15, 0.12);
      } else {
        targetAmpMod = 0;
        targetSpeedMod = 0;
      }
    };
    animateId = requestAnimationFrame(update);

    // Streamlit Message Handlers
    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") {
        const args = event.data.args;

        // Update local config variables from Python
        for (const key in args) {
          if (args.hasOwnProperty(key)) {
            config[key] = args[key];
          }
        }

        // Update CSS palette colors dynamically if customized
        if (config.colors && config.colors.length >= 3) {
          document.documentElement.style.setProperty('--glow-listening', `rgba(${hexToRgb(config.colors[0])}, 0.6)`);
          document.documentElement.style.setProperty('--glow-thinking', `rgba(${hexToRgb(config.colors[1])}, 0.6)`);
          document.documentElement.style.setProperty('--glow-speaking', `rgba(${hexToRgb(config.colors[2])}, 0.6)`);
        }

        // Handle Status and Playback changes
        updateUIState(config.status);

        if (args.audio_data && args.audio_data !== prevAudioData) {
          prevAudioData = args.audio_data;
          playBase64Audio(args.audio_data);
        }
      }
    });

    let prevAudioData = null;
    let micSourceNode = null;
    let ttsSourceNode = null;

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255,255,255';
    }

    // Tell Streamlit component is ready
    function initStreamlitComponent() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      sendFrameHeight();
    }

    // Preload ONNX weights silently on startup without mic prompt
    async function preloadVAD() {
      try {
        console.log("Preloading Silero VAD weights...");
        await fetch("https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.18/dist/silero_vad.onnx");
        console.log("VAD weights preloaded!");
      } catch (e) {
        console.warn("Failed to preload VAD", e);
      }
    }
    preloadVAD();

    let myvad = null;

    // Audio Capture and WAV Encoder Logic
    async function startAudioRecording() {
      if (isRecording) return;
      initAudioContext();
      
      isRecording = true;
      config.status = 'listening';
      updateUIState('listening');
      sendMessageToStreamlit({ event: "mic_start" });

      try {
        // We get our own stream so we can route it to the visualizer AND the VAD
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Wire up visualizer (disconnect first to prevent echo bugs)
        if (micSourceNode) micSourceNode.disconnect();
        analyserNode.disconnect();
        micSourceNode = audioContext.createMediaStreamSource(micStream);
        micSourceNode.connect(analyserNode);

        // Initialize and start Silero VAD
        myvad = await vad.MicVAD.new({
          stream: micStream,
          redemptionFrames: 25,       // Wait ~750ms of silence before cutting off (reduced from 3s for fast response)
          positiveSpeechThreshold: 0.8, // Stricter threshold to ignore background noise
          onSpeechStart: () => {
            console.log("Silero VAD: Speech start detected");
          },
          onSpeechEnd: (audioFloat32Array) => {
            console.log("Silero VAD: Speech end detected");
            
            if (!isRecording) return; // Prevent double firing
            
            // We do NOT set isRecording to false, so the session stays active
            // Instead, we just temporarily pause the VAD so it doesn't pick up the AI's response
            myvad.pause();
            
            // audioFloat32Array is exactly the speech segment! Encode it to WAV.
            const wavBlob = encodeWAV(audioFloat32Array);
            
            const reader = new FileReader();
            reader.onloadend = function () {
              const base64Audio = reader.result.split(',')[1];
              sendMessageToStreamlit({
                event: "audio_recorded",
                audio: base64Audio
              });
              config.status = 'thinking';
              updateUIState('thinking');
            };
            reader.readAsDataURL(wavBlob);
          },
          onVADMisfire: () => {
            console.log("Silero VAD: Misfire (audio too short)");
          }
        });
        
        myvad.start();
        
      } catch (err) {
        console.error("Mic access denied or VAD error:", err);
        isRecording = false;
        config.status = 'idle';
        updateUIState('idle');
      }
    }

    function cleanupRecording() {
      if (myvad) {
        try { myvad.destroy(); } catch (e) { }
        myvad = null;
      }
      if (micStream) {
        try { micStream.getTracks().forEach(track => track.stop()); } catch (e) { }
        micStream = null;
      }
    }

    function pauseAudioRecording() {
      if (!isRecording) return;
      isRecording = false;
      cleanupRecording();
      
      config.status = 'idle';
      updateUIState('idle');
      sendMessageToStreamlit({ event: "mic_pause" });
    }

    function stopAudioRecording() {
      // Manual stop bypasses VAD, but Silero handles everything automatically now
      pauseAudioRecording();
    }

    // Audio Playback
    function playBase64Audio(base64Data) {
      if (!base64Data) return;

      initAudioContext();

      // Create an HTML5 Audio element which natively supports MP3 decoding
      const audio = new Audio("data:audio/mp3;base64," + base64Data);
      
      // Stop active playing source if any
      if (activeAudioSource) {
        try { activeAudioSource.pause(); } catch (e) { }
      }
      activeAudioSource = audio;

      audio.onended = () => {
        if (myvad && isRecording) {
            // Auto-resume listening for continuous conversation
            config.status = 'listening';
            updateUIState('listening');
            
            try {
              analyserNode.disconnect();
              if (ttsSourceNode) { ttsSourceNode.disconnect(); ttsSourceNode = null; }
              if (micSourceNode) { micSourceNode.connect(analyserNode); }
            } catch (e) {}

            myvad.start();
        } else {
            config.status = 'idle';
            updateUIState('idle');
        }
        sendMessageToStreamlit({ event: "audio_finished" });
      };

      audio.play().then(() => {
        // Wire up audio player through analyser node for WebGL visualizer reactivity
        // We do this after play() resolves to avoid autoplay DOM exceptions
        try {
          if (micSourceNode) micSourceNode.disconnect(); // Prevent mic from routing to speakers!
          analyserNode.disconnect(); // Disconnect from previous playbacks
          if (ttsSourceNode) { ttsSourceNode.disconnect(); }
          
          // Fix: Some browsers only allow creating MediaElementSource once per element
          if (!audio.mediaElementSourceCreated) {
              ttsSourceNode = audioContext.createMediaElementSource(audio);
              audio.mediaElementSourceCreated = true;
          }
          ttsSourceNode.connect(analyserNode);
          analyserNode.connect(audioContext.destination);
        } catch (err) {
          console.warn("Could not wire audio to visualizer (already connected?)", err);
        }
      }).catch(err => {
        console.error("Audio playback error:", err);
        config.status = 'idle';
        updateUIState('idle');
        sendMessageToStreamlit({ event: "audio_finished" });
      });
    }

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    // WAV format compilation helpers
    function mergeBuffers(channelBuffer, length) {
      const result = new Float32Array(length);
      let offset = 0;
      for (let i = 0; i < channelBuffer.length; i++) {
        const buffer = channelBuffer[i];
        result.set(buffer, offset);
        offset += buffer.length;
      }
      return result;
    }

    function writeUTFBytes(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function encodeWAV(samples) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      writeUTFBytes(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeUTFBytes(view, 8, 'WAVE');
      writeUTFBytes(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM format
      view.setUint16(22, 1, true); // 1 Channel (mono)
      view.setUint32(24, 16000, true); // Sample rate: 16000Hz
      view.setUint32(28, 16000 * 2, true); // Byte rate (16000 * 2 bytes)
      view.setUint16(32, 2, true); // Block align (1 channel * 2 bytes/sample)
      view.setUint16(34, 16, true); // 16 bits per sample
      writeUTFBytes(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    // Toggle Mic Event: Click to Start Listening, Click again to Pause Listening
    micBtn.addEventListener('click', () => {
      if (isRecording || config.status === 'listening') {
        pauseAudioRecording();
      } else {
        startAudioRecording();
      }
    });

    // End/Handoff Event
    endBtn.addEventListener('click', () => {
      // Pause mic if active
      if (isRecording) {
        isRecording = false;
        if (micStream) {
          try { micStream.getTracks().forEach(track => track.stop()); } catch (e) { }
          micStream = null;
        }
        if (micProcessor) {
          try { micProcessor.disconnect(); } catch (e) { }
          micProcessor = null;
        }
      }
      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch (e) { }
      }

      config.status = 'idle';
      updateUIState('idle');
      sendMessageToStreamlit({ event: "end_session" });
    });

    // Initialize SpecularButton WebGL Shader on End Session Button
    function initEndBtnSpecular() {
      const btn = document.getElementById('end-btn');
      const fx = document.getElementById('end-btn-fx');
      if (!btn || !fx) return;

      const PAD = 20;
      const VERT_SPECULAR = `#version 300 es
      in vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
      `;

      const FRAG_SPECULAR = `#version 300 es
      precision highp float;

      uniform vec2 uCenter;
      uniform vec2 uHalfSize;
      uniform float uRadius;
      uniform float uAngle;
      uniform float uPx;
      uniform vec3 uLineColor;
      uniform vec3 uBaseColor;
      uniform float uIntensity;
      uniform float uShineSize;
      uniform float uShineFade;
      uniform float uThickness;
      uniform float uBaseWidth;

      out vec4 fragColor;

      float sdRoundedRect(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
      }

      float shapeSDF(vec2 p) { return sdRoundedRect(p, uHalfSize, uRadius); }

      float gaussianLine(float d, float sigma) {
        float x = d / (sigma + 1e-6);
        float k = mix(1.0, 1.6, smoothstep(0.0, 1.5, x));
        return exp(-k * x * x);
      }

      void main() {
        vec2 p = gl_FragCoord.xy - uCenter;
        float d = shapeSDF(p);
        vec2 L = vec2(cos(uAngle), sin(uAngle));

        float base = (1.0 - smoothstep(0.0, uBaseWidth, abs(d))) * 0.45;

        vec2 nEll = normalize(p / (uHalfSize * uHalfSize) + 1e-6);
        float phi = acos(clamp(abs(dot(nEll, L)), 0.0, 1.0));
        float rim = 1.0 - smoothstep(uShineSize - uShineFade, uShineSize + uShineFade + 1e-4, phi);
        float line = gaussianLine(d, uThickness);
        float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));
        float hi = line * rim * edgeClamp * uIntensity;

        vec3 col = uBaseColor * base + uLineColor * hi;
        float a = clamp(base + hi, 0.0, 1.0);
        fragColor = vec4(col, a);
      }
      `;

      const dpr = window.devicePixelRatio || 1;
      const sRenderer = new Renderer({ alpha: true, premultipliedAlpha: true, antialias: true, dpr });
      const sGl = sRenderer.gl;
      sGl.clearColor(0, 0, 0, 0);
      sGl.enable(sGl.BLEND);
      sGl.blendFunc(sGl.ONE, sGl.ONE_MINUS_SRC_ALPHA);

      const sGeometry = new Triangle(sGl);
      if (sGeometry.attributes.uv) delete sGeometry.attributes.uv;

      const sProgram = new Program(sGl, {
        vertex: VERT_SPECULAR,
        fragment: FRAG_SPECULAR,
        uniforms: {
          uCenter: { value: [0, 0] },
          uHalfSize: { value: [1, 1] },
          uRadius: { value: 0 },
          uAngle: { value: 2.4 },
          uPx: { value: dpr },
          uLineColor: { value: [1, 0.42, 0.42] },
          uBaseColor: { value: [0.75, 0.31, 0.31] },
          uIntensity: { value: 2.5 },
          uShineSize: { value: (30 * Math.PI) / 180 },
          uShineFade: { value: (45 * Math.PI) / 180 },
          uThickness: { value: 1.2 * dpr },
          uBaseWidth: { value: dpr }
        }
      });

      const sMesh = new Mesh(sGl, { geometry: sGeometry, program: sProgram });
      fx.appendChild(sGl.canvas);

      const sizeRef = { w: 1, h: 1 };
      const resizeSpecular = () => {
        const rect = btn.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w <= 0 || h <= 0) return;
        sizeRef.w = w;
        sizeRef.h = h;
        sRenderer.setSize(w + PAD * 2, h + PAD * 2);
        sProgram.uniforms.uCenter.value = [(PAD + w / 2) * dpr, (PAD + h / 2) * dpr];
        sProgram.uniforms.uHalfSize.value = [(w / 2) * dpr, (h / 2) * dpr];
      };
      const ro = new ResizeObserver(resizeSpecular);
      ro.observe(btn);
      resizeSpecular();

      let pointerAngle = null;
      let proximityT = 0;
      const proximityRadius = 250;

      const onPointerMove = e => {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
        const dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
        const dist = Math.hypot(dx, dy);
        if (dist === 0) {
          const nx = (e.clientX - cx) / (rect.width / 2);
          const ny = (cy - e.clientY) / (rect.height / 2);
          pointerAngle = Math.atan2(2 / rect.height, -2 / rect.width) + nx * 0.3 + ny * 0.15;
        } else {
          pointerAngle = Math.atan2(cy - e.clientY, e.clientX - cx);
        }
        const t = Math.max(0, 1 - dist / Math.max(proximityRadius, 1));
        proximityT = t * t * (3 - 2 * t);
      };
      window.addEventListener('pointermove', onPointerMove);

      let angle = 2.4;
      let idleAngle = 2.4;
      let bright = 0;
      let last = performance.now();
      let raf = 0;

      const lineC = new Color('#ff6b6b');
      const baseC = new Color('#be5050');

      const updateSpecular = now => {
        raf = requestAnimationFrame(updateSpecular);
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;

        idleAngle += 0.35 * dt;
        const steer = pointerAngle != null;
        const target = steer ? pointerAngle : idleAngle;
        const diff = ((target - angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        angle += diff * (1 - Math.exp(-dt * 7));

        bright += (proximityT - bright) * (1 - Math.exp(-dt * 8));

        sProgram.uniforms.uAngle.value = angle;
        sProgram.uniforms.uRadius.value = (Math.min(sizeRef.w, sizeRef.h) / 2) * dpr;
        sProgram.uniforms.uLineColor.value = [lineC.r, lineC.g, lineC.b];
        sProgram.uniforms.uBaseColor.value = [baseC.r, baseC.g, baseC.b];
        sProgram.uniforms.uIntensity.value = 2.5 * bright;
        sRenderer.render({ scene: sMesh });
      };
      raf = requestAnimationFrame(updateSpecular);
    }

    initEndBtnSpecular();

    // Initialize communication with Streamlit
    initStreamlitComponent();
  </script>
</body>
